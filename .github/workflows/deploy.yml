name: Deploy Quartz site to GitHub Pages

on:
  workflow_dispatch:
  #push:
  #    branches:
  #    - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Clona la repo principale e tutti i submodule
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # Aggiorna tutti i submodule al branch remoto configurato
      - name: Update submodules to latest commit
        run: git submodule update --remote --recursive

      # Commit & push submodule updates solo se ci sono cambiamenti
      - name: Commit & push submodule updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update submodules to latest commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:v4 || echo "No changes to push"

      # Setup Node.js
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Installa dipendenze
      - name: Install Dependencies
        run: npm ci

      # Build del sito Quartz
      - name: Build Quartz
        run: npx quartz build

      # Upload del sito generato come artifact per GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


